<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}会记 · AI 会议纪要助手{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{{ url_for('main.index') }}">
        <span class="brand-mark">会</span>
        <span class="brand-text">会记<em>AI 会议纪要助手</em></span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('main.index') }}"
           class="{{ 'active' if request.endpoint in ['main.index', 'main.meeting_detail', 'main.new_meeting', 'main.edit_meeting'] else '' }}">会议</a>
        <a href="{{ url_for('main.ask') }}"
           class="{{ 'active' if request.endpoint == 'main.ask' else '' }}">智能问答</a>
        <a class="btn btn-primary btn-sm" href="{{ url_for('main.new_meeting') }}">＋ 新建会议</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flashes">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">会记 · AI 会议纪要助手 · 小型应用系统课程设计</div>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
